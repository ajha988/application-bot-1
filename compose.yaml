services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATA_DIR: /data
      REMOTE_DESKTOP_ENABLED: "true"
      DESKTOP_SECURE_COOKIE: "true"
    expose:
      - "10000"
    volumes:
      - application-data:/data
    shm_size: 512mb
    init: true
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?Set BOT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot
volumes:
  application-data:
  caddy-data:
  caddy-config:
