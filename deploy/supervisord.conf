[supervisord]
nodaemon=true
logfile=/tmp/supervisor.log
pidfile=/tmp/supervisor.pid
childlogdir=/tmp

[program:display]
command=Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp
priority=10
autorestart=true

[program:window-manager]
command=fluxbox -display :99
priority=20
autorestart=true

[program:vnc]
command=x11vnc -display :99 -localhost -nopw -forever -shared -rfbport 5900
priority=30
autorestart=true

[program:websockify]
command=websockify 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true

[program:api]
command=python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 --no-access-log
directory=/app
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=nginx -c /tmp/nginx.conf -g "daemon off;"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
